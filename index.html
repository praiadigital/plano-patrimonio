<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Plano Patrimônio — Praia Digital</title><meta name="description" content="Projeção de patrimônio a 10 anos com valorização do imóvel + renda de temporada no litoral."><link rel="canonical" href="https://praia.digital/plano-patrimonio/"><style>body{font-family:system-ui,sans-serif;margin:0;background:#0b1220;color:#e8ecf1}main{max-width:860px;margin:auto;padding:24px}input{width:100%;padding:10px;border-radius:8px;background:#0f172a;color:#e8ecf1;border:1px solid #243348;margin:4px 0 12px;box-sizing:border-box}.panel{background:#121c2e;border:1px solid #243348;border-radius:14px;padding:20px;margin-bottom:14px}table{width:100%;border-collapse:collapse}td{padding:6px;border-bottom:1px solid #243348;font-size:14px}.btn{display:inline-block;padding:10px 16px;border-radius:10px;background:#1f6feb;color:#fff;text-decoration:none;font-weight:600;border:0;cursor:pointer}</style></head><body><nav style="background:#0a2540;padding:14px 20px"><span style="color:#fff;font-weight:700;margin-right:16px">🌊 Praia Digital</span><a href="https://praia.digital/apps/" style="color:#9fd8ff;margin-right:12px">Apps</a><a href="https://praia.digital/aposentadoria-praia/" style="color:#9fd8ff;margin-right:12px">Aposentadoria Praia</a><a href="https://praia.digital/valorizador/" style="color:#9fd8ff;margin-right:12px">Valorizador</a><a href="https://praia.digital/investidores/" style="color:#9fd8ff">Radar do Investidor</a></nav><main><h1>📊 Plano Patrimônio</h1><p>Projete seu patrimônio a 10 anos: valorização do imóvel + renda líquida de temporada acumulada.</p><div class="panel"><label>Valor do imóvel hoje (R$)</label><input id="v" type="number" value="500000"><label>Valorização anual (%)</label><input id="g" type="number" value="8"><label>Renda líquida de temporada por ano (R$)</label><input id="r" type="number" value="40000"><label>Reinvestir a renda a (% a.a.)</label><input id="j" type="number" value="10"><button class="btn" onclick="go()">Projetar 10 anos</button></div><div class="panel" id="out" style="display:none"><table><tr><th>Ano</th><th>Imóvel</th><th>Renda acumulada</th><th>Patrimônio</th></tr><tbody id="tb"></tbody></table></div></main><script>function fmt(x){return x.toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});}function go(){const v0=+document.getElementById('v').value,g=+document.getElementById('g').value/100,r=+document.getElementById('r').value,j=+document.getElementById('j').value/100;let im=v0,ac=0,rows='';for(let y=1;y<=10;y++){im*=1+g;ac=ac*(1+j)+r;rows+='<tr><td>'+y+'</td><td>'+fmt(im)+'</td><td>'+fmt(ac)+'</td><td><b>'+fmt(im+ac)+'</b></td></tr>';}document.getElementById('out').style.display='block';document.getElementById('tb').innerHTML=rows;}</script></body></html>
